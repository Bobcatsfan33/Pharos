name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  issues: read
jobs:
  enterprise-readiness:
    name: enterprise evidence and decision integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/verify-enterprise-readiness.mjs
      - run: node scripts/verify-external-gate-trackers.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/verify-action-pins.mjs
      - name: refuse false production approval
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const source = "docs/enterprise-readiness.json";
          const target = "/tmp/pharos-false-approval.json";
          const document = JSON.parse(fs.readFileSync(source, "utf8"));
          document.assessment.deploymentDecision = "approved";
          fs.writeFileSync(target, JSON.stringify(document));
          JS
          if node scripts/verify-enterprise-readiness.mjs /tmp/pharos-false-approval.json; then
            echo "readiness verifier accepted false production approval" >&2
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - name: lint chart
        run: >-
          helm lint deploy/helm
          --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --set config.tsaUrl=https://tsa.example.com/tsr
          --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          --set judgeDriftProfile.existingConfigMap=pharos-judge-drift
          --set ingress.enabled=true
          --set ingress.host=pharos.example.com
          --set ingress.tls.secretName=pharos-tls
      - name: render production manifests
        run: |
          helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls \
            > rendered-api.yaml
          grep -q 'name: PHAROS_JUDGE_PROVIDER' rendered-api.yaml
          grep -q 'value: "onnx"' rendered-api.yaml
          grep -q 'name: judge-models' rendered-api.yaml
          grep -q 'sizeLimit: 2Gi' rendered-api.yaml
          grep -q 'kubernetes.io/arch: amd64' rendered-api.yaml
          grep -q 'kubernetes.io/os: linux' rendered-api.yaml
          grep -q 'name: PHAROS_JUDGE_DRIFT_PROFILE_PATH' rendered-api.yaml
          grep -q 'name: "pharos-judge-drift"' rendered-api.yaml
          # The signing boundary must be a real HSM, never the on-disk dev keystore (#78).
          grep -q 'name: PHAROS_KMS_PROVIDER' rendered-api.yaml
          grep -q 'value: "aws-kms"' rendered-api.yaml
          # The front door must actually terminate TLS (#76). Pharos listens on plain HTTP
          # by design, so these assertions are the only thing standing between a rendered
          # production deployment and serving evidence over cleartext.
          grep -q 'kind: Ingress' rendered-api.yaml
          grep -q 'force-ssl-redirect: "true"' rendered-api.yaml
          grep -q 'ssl-protocols: "TLSv1.3"' rendered-api.yaml
          grep -q 'hsts: "true"' rendered-api.yaml
          # Rendered as an integer, not "6.3072e+07" — nginx rejects scientific notation.
          grep -q 'hsts-max-age: "63072000"' rendered-api.yaml
          grep -q 'secretName: "pharos-tls"' rendered-api.yaml
          grep -q 'name: PHAROS_TLS_TERMINATOR' rendered-api.yaml
          grep -q 'value: "helm-ingress/nginx"' rendered-api.yaml
      - name: production must reject an undeclared TLS terminator
        # Issue #76: Pharos does not terminate TLS in-process, so the risk is not the
        # design — it is leaving the terminator UNDECLARED, which is how a cluster ends
        # up serving evidence over cleartext while everyone assumes someone else handled
        # it. Asserting the specific message pins the guard rather than an incidental
        # render failure.
        run: |
          set +e
          out=$(helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "production rendered with no declared TLS terminator"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'production requires a declared TLS terminator'; then
            echo "render failed, but not on the TLS terminator guard:"
            printf '%s\n' "$out"
            exit 1
          fi
      - name: production must reject an ingress without a TLS secret
        run: |
          set +e
          out=$(helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ingress rendered with no TLS secret"
            exit 1
          fi
          printf '%s' "$out" | grep -q 'never be exposed over cleartext'
      - name: an external terminator must be declared by name, and renders no Ingress
        # The escape hatch for a mesh/LB this chart does not manage. It must be a
        # positive declaration naming the owner, not merely the absence of an Ingress.
        run: |
          helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.externalTerminator=istio-ingressgateway \
            > rendered-external.yaml
          if grep -q 'kind: Ingress' rendered-external.yaml; then
            echo "external terminator declared but the chart still rendered an Ingress"
            exit 1
          fi
          grep -q 'name: PHAROS_TLS_TERMINATOR' rendered-external.yaml
          grep -q 'value: "istio-ingressgateway"' rendered-external.yaml
      - name: mTLS at the front door renders client-certificate verification
        run: |
          helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls \
            --set ingress.mtls.enabled=true \
            --set ingress.mtls.clientCaSecret=pharos-client-ca \
            > rendered-mtls.yaml
          grep -q 'auth-tls-verify-client: "on"' rendered-mtls.yaml
          grep -q 'auth-tls-secret: "pharos/pharos-client-ca"' rendered-mtls.yaml
      - name: production must reject the local development KMS
        # Issue #78: local-kms writes plaintext PKCS8 private keys to disk, so production
        # must refuse it. `config.localKms.existingClaim` is supplied deliberately: without
        # it the render fails on a `required` persistent-claim lookup instead, which would
        # make this gate pass even if the posture guard were deleted. Asserting the specific
        # failure message pins the guard itself, not an incidental error.
        run: |
          set +e
          out=$(helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls \
            --set config.kmsProvider=local-kms \
            --set config.localKms.existingClaim=pharos-signing-keys 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "production unexpectedly rendered with the local development KMS"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'production deployments require config.kmsProvider=aws-kms'; then
            echo "render failed, but not on the production KMS posture guard:"
            printf '%s\n' "$out"
            exit 1
          fi
      - name: production must reject the linear judge baseline
        run: |
          if helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls \
            --set config.judgeProvider=linear; then
            echo "production unexpectedly rendered with the linear judge baseline"
            exit 1
          fi
      - name: production must fail closed without an approved TSA certificate pin
        run: |
          if helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls; then
            echo "production unexpectedly rendered without an approved TSA certificate pin"
            exit 1
          fi
      - name: production must fail closed without an approved judge drift profile
        run: |
          if helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls; then
            echo "production unexpectedly rendered without an approved judge drift profile"
            exit 1
          fi
      - name: lint and render production gateway
        run: |
          args=(
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            --set config.tsaUrl=https://tsa.example.com/tsr
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift
            --set ingress.enabled=true
            --set ingress.host=pharos.example.com
            --set ingress.tls.secretName=pharos-tls
            --set gateway.enabled=true
            --set gateway.secretName=pharos-gateway-secrets
            --set gateway.tenantId=tenant-a
            --set gateway.agentId=agent-a
            --set gateway.target=https://upstream.example.test
            --set gateway.idempotencyProbePath=/.well-known/pharos-idempotency
            --set-string gateway.networkPolicy.ingressPodSelector.app=agent
            --set-string gateway.networkPolicy.target.podSelector.app=upstream
            --set-string 'gateway.networkPolicy.database.cidrs[0]=10.20.0.0/24'
          )
          helm lint deploy/helm "${args[@]}"
          helm template pharos deploy/helm --namespace pharos "${args[@]}" > rendered.yaml
          grep -q 'name: pharos-gateway' rendered.yaml
          grep -q 'kind: HorizontalPodAutoscaler' rendered.yaml
          grep -q 'kind: NetworkPolicy' rendered.yaml
          grep -q 'path: /__pharos/readyz' rendered.yaml
      - name: production gateway must fail closed without network allowlists
        run: |
          if helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls \
            --set gateway.enabled=true \
            --set gateway.secretName=pharos-gateway-secrets \
            --set gateway.tenantId=tenant-a \
            --set gateway.agentId=agent-a \
            --set gateway.target=https://upstream.example.test \
            --set gateway.idempotencyProbePath=/.well-known/pharos-idempotency; then
            echo "production gateway unexpectedly rendered without network allowlists"
            exit 1
          fi
      - name: production gateway must fail closed without idempotency conformance
        run: |
          if helm template pharos deploy/helm \
            --namespace pharos \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set config.tsaUrl=https://tsa.example.com/tsr \
            --set config.tsaCertSha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set judgeDriftProfile.existingConfigMap=pharos-judge-drift \
            --set ingress.enabled=true \
            --set ingress.host=pharos.example.com \
            --set ingress.tls.secretName=pharos-tls \
            --set gateway.enabled=true \
            --set gateway.secretName=pharos-gateway-secrets \
            --set gateway.tenantId=tenant-a \
            --set gateway.agentId=agent-a \
            --set gateway.target=https://upstream.example.test \
            --set-string gateway.networkPolicy.ingressPodSelector.app=agent \
            --set-string gateway.networkPolicy.target.podSelector.app=upstream \
            --set-string 'gateway.networkPolicy.database.cidrs[0]=10.20.0.0/24'; then
            echo "production gateway unexpectedly rendered without idempotency conformance"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint (blocking)
        run: pnpm lint
      - name: prettier format check (blocking)
        run: pnpm format:check
      - name: pnpm audit (blocking high/critical gate)
        run: pnpm audit --audit-level=high

  training-supply-chain:
    name: training lock audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: verify and export the locked training graph
        run: |
          uv lock --directory training --check
          uv export \
            --directory training \
            --frozen \
            --python "${{ matrix.python-version }}" \
            --no-dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file "${RUNNER_TEMP}/training-requirements.txt"
      - name: audit every locked training dependency
        run: >-
          uv run --directory training --frozen --only-group audit
          pip-audit --require-hashes --disable-pip --progress-spinner=off
          -r "${RUNNER_TEMP}/training-requirements.txt"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharos
          POSTGRES_PASSWORD: pharos_local_dev
          POSTGRES_DB: pharos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pharos" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # MinIO needs a `server` command, which GitHub service containers can't pass,
      # so run it as a step (same image as docker-compose).
      - name: Start MinIO (S3 WORM)
        run: |
          docker run -d --name minio -p 9010:9000 \
            -e MINIO_ROOT_USER=pharos -e MINIO_ROOT_PASSWORD=pharos_local_dev \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9010/minio/health/ready; then echo "minio ready"; break; fi
            sleep 2
          done

      # KMS emulator for the aws-kms integration test (S3-T0 spike choice: nsmithuk/local-kms —
      # license-free, unlike LocalStack, which now requires a paid token). ~36MB, starts fast.
      - name: Start KMS emulator (nsmithuk/local-kms)
        run: |
          docker run -d --name local-kms -p 8088:8080 nsmithuk/local-kms:latest
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://localhost:8088; then echo "kms ready"; break; fi
            sleep 1
          done

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Publishable packages export ./dist; with no tsconfig paths, cross-package typecheck
      # resolves them via exports, so their dist must exist before `pnpm -r typecheck`.
      - run: pnpm build:publishable
      - run: pnpm -r typecheck
      - name: test
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=vitest-report.json
        env:
          PHAROS_ENV: local
          PHAROS_PG_URL: postgres://pharos:pharos_local_dev@localhost:5433/pharos
          PHAROS_REDIS_URL: redis://localhost:6380
          PHAROS_S3_ENDPOINT: http://localhost:9010
          PHAROS_S3_REGION: us-east-1
          PHAROS_S3_BUCKET: pharos-evidence
          PHAROS_S3_ACCESS_KEY: pharos
          PHAROS_S3_SECRET_KEY: pharos_local_dev
          PHAROS_S3_FORCE_PATH_STYLE: "true"
      - name: integration tests must run, not skip
        if: always()
        run: |
          node -e '
            const r = require("./vitest-report.json");
            const skipped = (r.numPendingTests ?? 0) + (r.numTodoTests ?? 0);
            console.log(`passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${skipped}`);
            if (r.numFailedTests > 0) process.exit(1);
            if (skipped > 0) {
              console.error("Integration tests skipped — the flagship guarantees (durability, seal, causeway, ...) were not exercised. CI provisions Postgres/Redis/MinIO, so skips mean the services were unreachable.");
              process.exit(1);
            }
          '

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: python conformance
        working-directory: sdks/python
        run: PYTHONPATH=. python -m pytest tests/ -q

  changeset:
    # Any PR that changes a publishable (non-private) package must include a changeset.
    # Add the `no-changeset` label to skip (docs-only / internal-only changes).
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: require a changeset for publishable-package changes
        run: |
          # Full history (not --depth=1): changesets needs the merge-base with the base branch.
          # A shallow base fetch breaks fork PRs (and PRs branched from an older main) with
          # "Failed to find where HEAD diverged from origin/main". checkout used fetch-depth: 0.
          git fetch origin '${{ github.event.pull_request.base.ref }}'
          pnpm exec changeset status --since="origin/${{ github.event.pull_request.base.ref }}"

  dco:
    # Every commit in a PR must be signed off (git commit -s) per the DCO. See CONTRIBUTING.md.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: DCO sign-off check
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          for c in $(git rev-list "$base".."$head"); do
            if ! git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") is missing a Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Every commit must be signed off with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off (DCO)."
