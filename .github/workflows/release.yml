name: release
# Publishes the SDKs and builds the Pharos Runtime from signed, stable-version artifacts.
#   @getpharos/sdk -> npm  (with provenance)
#   getpharos  -> PyPI (with trusted publishing / OIDC)
#   pharos-runtime -> verified wheel + optional PyPI trusted publishing after project setup
#
# Stable vMAJOR.MINOR.PATCH tags publish SDKs. Semver prerelease tags intentionally skip these
# irreversible registry jobs; image.yml uses those tags to publish assessment images instead.
# workflow_dispatch remains an explicit maintainer-controlled SDK release path.
# Requires (set up by a maintainer — see docs/PUBLISHING.md):
#   - npm org "getpharos"; trusted publisher on @getpharos/sdk -> this repo + release.yml,
#     environment "production-release" (no secret).
#     (First 0.1.0 publish is done manually by the maintainer; this workflow covers all later tags.)
#   - PyPI pending trusted publisher: project "getpharos" -> this repo + release.yml, environment "pharos".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-channel:
    runs-on: ubuntu-latest
    outputs:
      publish_sdks: ${{ steps.classify.outputs.publish_sdks }}
      channel: ${{ steps.classify.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - id: classify
        name: classify stable, prerelease, or manual release
        shell: bash
        run: |
          set -euo pipefail
          CLASSIFICATION="$(node scripts/classify-release-ref.mjs "${GITHUB_EVENT_NAME}" "${GITHUB_REF}")"
          echo "channel=$(jq -r '.channel' <<<"${CLASSIFICATION}")" >> "${GITHUB_OUTPUT}"
          echo "publish_sdks=$(jq -r '.publishSdks' <<<"${CLASSIFICATION}")" >> "${GITHUB_OUTPUT}"

  npm-publish:
    needs: release-channel
    if: needs.release-channel.outputs.publish_sdks == 'true'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v6, matching ci.yml. action-setup v4 refuses to run when a `version` input and
      # package.json's `packageManager` field both specify pnpm -- which is exactly this
      # repo's layout, so the v0.2.0 release failed here before publishing anything to npm.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the publishable packages first: their exports point at ./dist, so both the
      # cross-package typecheck below and `npm publish` need dist to exist.
      - name: build publishable packages
        run: pnpm build:publishable
      - name: typecheck
        run: pnpm -r typecheck
      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: publish @getpharos/sdk to npm (OIDC trusted publishing + provenance)
        working-directory: packages/sdk-ts
        run: npm publish --access public

  pypi-publish:
    needs: release-channel
    if: needs.release-channel.outputs.publish_sdks == 'true'
    runs-on: ubuntu-latest
    environment: pharos # MUST match the environment on the PyPI trusted publisher
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: hermetic SDK tests
        working-directory: sdks/python
        run: |
          pip install pytest
          PYTHONPATH=. python -m pytest tests/ -q
      - name: build sdist + wheel
        working-directory: sdks/python
        run: |
          pip install build
          python -m build
      - name: publish getpharos to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdks/python/dist
          # A release must be re-runnable. Without this, re-running a failed release --
          # or tagging when the Python SDK version is already on PyPI, which is exactly
          # the v0.2.0 case -- fails the job on "file already exists" even though the
          # published artifact is correct. PyPI versions are immutable, so skipping an
          # existing one cannot overwrite anything.
          skip-existing: true

  runtime-package:
    needs: release-channel
    if: needs.release-channel.outputs.publish_sdks == 'true'
    runs-on: ubuntu-latest
    environment: pharos
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: test and build Pharos Runtime
        working-directory: runtime/python
        run: |
          pip install -e ".[dev,viewer]" build twine
          pytest -q
          python -m build
          twine check dist/*
      - name: install the built wheel and smoke both command names
        run: |
          python -m venv /tmp/pharos-runtime-release-smoke
          /tmp/pharos-runtime-release-smoke/bin/pip install runtime/python/dist/*.whl
          /tmp/pharos-runtime-release-smoke/bin/pharos --help | grep -q "usage: pharos"
          /tmp/pharos-runtime-release-smoke/bin/keel --help | grep -q "usage: keel"
      - name: retain the verified runtime distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pharos-runtime-${{ github.ref_name }}
          path: runtime/python/dist/*
          if-no-files-found: error
          retention-days: 90
      - name: publish pharos-runtime to PyPI after trusted-publisher activation
        if: vars.PHAROS_RUNTIME_PYPI_ENABLED == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: runtime/python/dist
          skip-existing: true
