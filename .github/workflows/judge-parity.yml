name: live judge parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/judge-parity.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/judge/**"
      - "services/api/src/platform.ts"
      - "test/fixtures/onnx-parity.json"
      - "test/onnx-serving.spec.ts"
      - "vitest.live.config.ts"
  pull_request:
    paths:
      - ".github/workflows/judge-parity.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/judge/**"
      - "services/api/src/platform.ts"
      - "test/fixtures/onnx-parity.json"
      - "test/onnx-serving.spec.ts"
      - "vitest.live.config.ts"

permissions:
  contents: read

concurrency:
  group: judge-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: hash-verified ONNX Node/Python parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify tokenizer, probability parity, registry path, and latency
        run: pnpm test:judge-parity
