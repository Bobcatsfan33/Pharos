name: live judge parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/judge-parity.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/judge/**"
      - "services/api/src/platform.ts"
      - "test/fixtures/onnx-parity.json"
      - "test/fixtures/onnx-parity-funds.json"
      - "test/onnx-serving.spec.ts"
      - "training/generate_runtime_parity_reference.py"
      - "vitest.live.config.ts"
  pull_request:
    paths:
      - ".github/workflows/judge-parity.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/judge/**"
      - "services/api/src/platform.ts"
      - "test/fixtures/onnx-parity.json"
      - "test/fixtures/onnx-parity-funds.json"
      - "test/onnx-serving.spec.ts"
      - "training/generate_runtime_parity_reference.py"
      - "vitest.live.config.ts"

permissions:
  contents: read

concurrency:
  group: judge-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: hash-verified ONNX Node/Python parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - name: generate hash-verified same-host Python reference
        run: |
          python -m pip install numpy==2.1.3 onnxruntime==1.30.0
          python training/generate_runtime_parity_reference.py "$RUNNER_TEMP/onnx-parity-finra-linux.json" test/fixtures/onnx-parity.json
          python training/generate_runtime_parity_reference.py "$RUNNER_TEMP/onnx-parity-funds-linux.json" test/fixtures/onnx-parity-funds.json
      - name: verify tokenizer, probability parity, registry path, and latency
        run: pnpm test:judge-parity
        env:
          PHAROS_ONNX_PARITY_REFERENCES: ${{ runner.temp }}/onnx-parity-finra-linux.json,${{ runner.temp }}/onnx-parity-funds-linux.json
