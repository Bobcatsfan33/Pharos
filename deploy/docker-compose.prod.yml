# Pharos — customer-hosted production API.
#
# Stateful dependencies are deliberately not bundled: production uses TLS-verifying managed
# PostgreSQL/Redis/object storage, workload identity for AWS KMS/S3, and a contracted RFC 3161 TSA.
# Supply an image by immutable, verified digest in PHAROS_IMAGE.
services:
  api:
    image: ${PHAROS_IMAGE:?set PHAROS_IMAGE to a verified image digest}
    restart: unless-stopped
    environment:
      PHAROS_ENV: prod
      PHAROS_PG_URL: ${PHAROS_PG_URL:?set a TLS-verifying PostgreSQL URL}
      PHAROS_REDIS_URL: ${PHAROS_REDIS_URL:?set a rediss URL}
      PHAROS_S3_ENDPOINT: ${PHAROS_S3_ENDPOINT:?set an HTTPS object-storage endpoint}
      PHAROS_S3_REGION: ${PHAROS_S3_REGION:?set PHAROS_S3_REGION}
      PHAROS_S3_BUCKET: ${PHAROS_S3_BUCKET:?set PHAROS_S3_BUCKET}
      PHAROS_S3_FORCE_PATH_STYLE: ${PHAROS_S3_FORCE_PATH_STYLE:-false}
      PHAROS_KMS_PROVIDER: aws-kms
      PHAROS_KMS_AWS_REGION: ${PHAROS_KMS_AWS_REGION:?set PHAROS_KMS_AWS_REGION}
      PHAROS_TSA_PROVIDER: rfc3161
      PHAROS_TSA_URL: ${PHAROS_TSA_URL:?set the contracted RFC 3161 endpoint}
      PHAROS_TSA_CERT_SHA256: ${PHAROS_TSA_CERT_SHA256:?set approved TSA certificate pins}
      PHAROS_TSA_ANCHOR_INTERVAL_MS: ${PHAROS_TSA_ANCHOR_INTERVAL_MS:-3600000}
      PHAROS_JUDGE_PROVIDER: onnx
      PHAROS_JUDGE_MODEL_DIR: /var/lib/pharos/judges
      PHAROS_JUDGE_DRIFT_PROFILE_PATH: /etc/pharos/judge-drift/profile.json
      PHAROS_ADMIN_TOKEN: ${PHAROS_ADMIN_TOKEN:?set PHAROS_ADMIN_TOKEN}
      PHAROS_ALLOWED_ORIGINS: ${PHAROS_ALLOWED_ORIGINS:-}
      PHAROS_TLS_TERMINATOR: ${PHAROS_TLS_TERMINATOR:?name the TLS-terminating proxy}
    ports:
      - "${PHAROS_API_PORT:-4000}:4000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - pharos-judge-models:/var/lib/pharos/judges
      - ${PHAROS_JUDGE_DRIFT_PROFILE_HOST_PATH:?set an approved drift profile path}:/etc/pharos/judge-drift/profile.json:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pharos-judge-models:
