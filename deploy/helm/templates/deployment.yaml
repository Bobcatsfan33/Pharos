{{- if eq .Values.config.env "prod" }}
{{- if not .Values.image.digest }}
{{- fail "production deployments require image.digest with a verified sha256 digest" }}
{{- end }}
{{- if ne .Values.config.kmsProvider "aws-kms" }}
{{- fail "production deployments require config.kmsProvider=aws-kms" }}
{{- end }}
{{- if ne .Values.config.tsaProvider "rfc3161" }}
{{- fail "production deployments require config.tsaProvider=rfc3161" }}
{{- end }}
{{- if not .Values.config.tsaUrl }}
{{- fail "production deployments require config.tsaUrl for a contracted RFC 3161 authority" }}
{{- end }}
{{- if not .Values.config.tsaCertSha256 }}
{{- fail "production deployments require config.tsaCertSha256 from an independently approved TSA certificate" }}
{{- end }}
{{- if ne .Values.config.judgeProvider "onnx" }}
{{- fail "production deployments require config.judgeProvider=onnx" }}
{{- end }}
{{- if not .Values.judgeDriftProfile.existingConfigMap }}
{{- fail "production deployments require judgeDriftProfile.existingConfigMap with an approved profile.json" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharos-api
  labels:
    app.kubernetes.io/name: pharos
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pharos
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharos
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: pharos-api
      automountServiceAccountToken: false
      # Dynamic-int8 judges are production-qualified only on linux-x64. Runtime identity is
      # also sealed into every Tier-3 verdict so replay never assumes cross-architecture parity.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/os: linux
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pharos
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ required "secretName must name an existing Kubernetes Secret" .Values.secretName }}
          env:
            - name: PHAROS_ENV
              value: {{ .Values.config.env | quote }}
            - name: PHAROS_API_PORT
              value: {{ .Values.api.port | quote }}
            - name: PHAROS_S3_BUCKET
              value: {{ .Values.config.s3Bucket | quote }}
            - name: PHAROS_S3_REGION
              value: {{ .Values.config.s3Region | quote }}
            - name: PHAROS_S3_FORCE_PATH_STYLE
              value: {{ .Values.config.s3ForcePathStyle | quote }}
            - name: PHAROS_KMS_PROVIDER
              value: {{ .Values.config.kmsProvider | quote }}
            - name: PHAROS_KMS_AWS_REGION
              value: {{ .Values.config.kmsAwsRegion | quote }}
            - name: PHAROS_KMS_AWS_ALLOW_KEY_CREATION
              value: {{ .Values.config.kmsAllowKeyCreation | default false | quote }}
            - name: PHAROS_TSA_PROVIDER
              value: {{ .Values.config.tsaProvider | quote }}
            {{- with .Values.config.tsaUrl }}
            - name: PHAROS_TSA_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.tsaCertSha256 }}
            - name: PHAROS_TSA_CERT_SHA256
              value: {{ . | quote }}
            {{- end }}
            - name: PHAROS_JUDGE_PROVIDER
              value: {{ .Values.config.judgeProvider | quote }}
            - name: PHAROS_JUDGE_MODEL_DIR
              value: {{ .Values.config.judgeModelDir | quote }}
            {{- if .Values.judgeDriftProfile.existingConfigMap }}
            - name: PHAROS_JUDGE_DRIFT_PROFILE_PATH
              value: /etc/pharos/judge-drift/profile.json
            {{- end }}
            - name: PHAROS_ALLOWED_ORIGINS
              value: {{ .Values.config.allowedOrigins | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            # Cold creation of three CPU inference sessions can take several minutes.
            failureThreshold: 300
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: judge-models
              mountPath: {{ .Values.config.judgeModelDir | quote }}
            {{- if .Values.judgeDriftProfile.existingConfigMap }}
            - name: judge-drift-profile
              mountPath: /etc/pharos/judge-drift
              readOnly: true
            {{- end }}
            {{- if eq .Values.config.kmsProvider "local-kms" }}
            - name: keystore
              mountPath: /var/lib/pharos/keys
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: judge-models
          {{- if .Values.judgeModelCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.judgeModelCache.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.judgeModelCache.sizeLimit }}
          {{- end }}
        {{- if .Values.judgeDriftProfile.existingConfigMap }}
        - name: judge-drift-profile
          configMap:
            name: {{ .Values.judgeDriftProfile.existingConfigMap | quote }}
            items:
              - key: profile.json
                path: profile.json
        {{- end }}
        {{- if eq .Values.config.kmsProvider "local-kms" }}
        - name: keystore
          persistentVolumeClaim:
            claimName: {{ required "local-kms requires config.localKms.existingClaim" .Values.config.localKms.existingClaim }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: pharos-api
  labels:
    app.kubernetes.io/name: pharos
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pharos
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
