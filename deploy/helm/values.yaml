# Pharos Helm values. Multi-AZ via replicaCount + podAntiAffinity (set by your platform).
image:
  # Signed image published to GHCR by .github/workflows/image.yml (cosign keyless + SBOM).
  # Verify before deploying — see deploy/INSTALL.md "Verifying the signed image".
  repository: ghcr.io/bobcatsfan33/pharos-api
  tag: "0.1.0"
  # Prefer a verified sha256:... digest in production; when set, digest wins over tag.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 3 # multi-AZ; spread with topologySpreadConstraints in production

api:
  port: 4000

# All secrets are required (no defaults). Provide via a Kubernetes Secret named pharos-secrets.
secretName: pharos-secrets

serviceAccount:
  # Use this for workload-identity annotations such as eks.amazonaws.com/role-arn.
  annotations: {}

# Optional zero-code governance gateway. It is disabled until the operator supplies an
# explicit tenant, upstream target, least-privilege Secret, and egress allowlist.
gateway:
  enabled: false
  replicaCount: 2
  port: 4100
  tenantId: ""
  agentId: ""
  target: ""
  # Relative to target and required in production. The endpoint must use the same durable
  # idempotency implementation as every side-effect route governed by this gateway.
  idempotencyProbePath: ""
  apiBase: "http://pharos-api"
  verdictDeadlineMs: 800
  # Must contain only PHAROS_API_KEY, PHAROS_PG_URL,
  # PHAROS_GATEWAY_HOLD_ACTIVE_KEY_ID, and PHAROS_GATEWAY_HOLD_KEYS_B64.
  # Do not reuse the broader API Secret.
  secretName: ""
  serviceAccount:
    annotations: {}
  podDisruptionBudget:
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  networkPolicy:
    enabled: true
    # Agent callers are limited to this namespace and, optionally, these pod labels.
    ingressPodSelector: {}
    dns:
      port: 53
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
    # Portable NetworkPolicy cannot allow DNS names. Supply either pod selectors for
    # in-cluster dependencies or CIDRs for managed/external dependencies.
    target:
      port: 443
      cidrs: []
      namespaceSelector: {}
      podSelector: {}
    database:
      port: 5432
      cidrs: []
      namespaceSelector: {}
      podSelector: {}

config:
  env: prod
  s3Bucket: pharos-evidence
  s3Region: us-east-1
  s3ForcePathStyle: "true"
  # KMS provider: "aws-kms" (production default) or "local-kms" (development only).
  #  - local-kms: Ed25519 keys in an on-disk keystore. You MUST give the keystore a persistent
  #    volume (PHAROS_KMS_KEYSTORE_DIR) — these keys sign every evidence record.
  #  - aws-kms: AWS KMS asymmetric keys (ECC_NIST_P256). Set PHAROS_KMS_AWS_REGION and provide
  #    credentials via the standard AWS chain (IRSA / instance role / env). No keystore volume
  #    needed — key material never leaves KMS.
  kmsProvider: aws-kms
  kmsAwsRegion: us-east-1
  # Pharos binds to one customer-managed CMK per tenant, located by a derived alias
  # (alias/pharos/<base64url(tenant:<id>)>/v<n> — see deploy/INSTALL.md "Provisioning signing
  # keys"). If the key is absent it fails closed and names the alias to provision. Setting this
  # true lets Pharos mint the CMK itself under the AWS *default* key policy rather than one you
  # control; appropriate for dev/evaluation, not for production.
  kmsAllowKeyCreation: false
  # A real TSA is the production default. Set the endpoint and independently obtained leaf
  # certificate SHA-256 pin(s); use a comma-separated overlap set during certificate rotation.
  tsaProvider: rfc3161
  tsaUrl: ""
  tsaCertSha256: ""
  # Production API startup preloads all three hash-verified ONNX judges.
  judgeProvider: onnx
  judgeModelDir: /var/lib/pharos/judges
  localKms:
    # Required when kmsProvider=local-kms; the chart never stores signing keys in emptyDir.
    existingClaim: ""
  allowedOrigins: ""

judgeModelCache:
  # Supply an RWX claim pre-staged with the approved content-addressed assets
  # for restricted networks. Empty uses a 2Gi emptyDir and fetches on cold boot.
  existingClaim: ""
  sizeLimit: 2Gi

judgeDriftProfile:
  # Required in production. The ConfigMap must contain an independently reviewed `profile.json`
  # generated from representative ONNX production-judge scores (never from the linear baseline).
  existingConfigMap: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true

# --- TLS / mTLS termination contract (#76) ---------------------------------------
# Pharos does NOT terminate TLS in-process. The container listens on plain HTTP and MUST
# sit behind a terminating front door that the HOST owns. That is a deliberate design
# choice — terminating in the app would put certificate lifecycle, cipher policy, and
# client-cert verification inside a process whose job is deciding and sealing verdicts.
#
# The risk is not the choice; it is leaving the choice UNDECLARED. In production this
# chart therefore refuses to render unless you say which component terminates: either set
# `ingress.enabled=true` to render the reference Ingress below, or name your own in
# `ingress.externalTerminator`. Silence is not an acceptable answer.
ingress:
  # Render the reference Ingress. Leave false if a mesh/LB you manage terminates instead.
  enabled: false
  className: nginx
  # Required when enabled.
  host: ""
  annotations: {}
  tls:
    # Kubernetes Secret (type kubernetes.io/tls) holding the serving certificate.
    secretName: ""
    # Floor, not a target. TLS 1.2 is permitted only for legacy clients that cannot do 1.3.
    minVersion: TLSv1.3
    # Seconds. Emitted as HSTS on the terminator, not by the app.
    hstsMaxAge: 63072000
  # Mutual TLS at the front door: the terminator verifies client certificates before any
  # request reaches Pharos. Required for the VPC/customer-hosted topologies where the
  # caller is a machine identity rather than a browser.
  mtls:
    enabled: false
    # Secret holding ca.crt used to verify client certificates. Required when mtls.enabled.
    clientCaSecret: ""
  # Name the component that terminates TLS when this chart does not (e.g.
  # "istio-ingressgateway", "aws-alb", "cloudflare"). Recorded so the operator's own
  # runbook and this deployment agree on who owns the front door.
  externalTerminator: ""

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

# Postgres / Redis / object storage are provided by the customer (managed RDS / ElastiCache /
# S3) and referenced via pharos-secrets. The chart does not bundle stateful stores in prod.
