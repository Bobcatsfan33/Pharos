[project]
name = "pharos-judge-training"
version = "0.0.0"
description = "Transformer judge training pipeline (Sprint 6). Out of the Node dependency tree."
requires-python = ">=3.10"
dependencies = [
  "torch==2.14.1",
  "transformers==5.17.0",
  "onnx==1.23.0",
  "onnxruntime==1.24.3",
  "numpy==2.2.6",
]

[tool.uv]
package = false
# Transitive-only packages pinned forward off the torch/triton graph to clear advisories the
# locked-graph audit flags: filelock (CVE-2026-112907..112940, fixed in 4.2.1) and setuptools
# (GHSA-xmj3-9gf7-h52w, fixed in 84.1.0). Constraints rather than dependencies: nothing here
# imports them directly, so they stay transitive and only their floor moves.
constraint-dependencies = [
  "filelock>=4.2.1; python_version >= '3.11'",
  "filelock>=4.1.0; python_version < '3.11'",
  "setuptools>=84.1.0",
]

[dependency-groups]
audit = ["pip-audit==2.10.1"]
