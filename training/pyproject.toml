[project]
name = "pharos-judge-training"
version = "0.0.0"
description = "Transformer judge training pipeline (Sprint 6). Out of the Node dependency tree."
requires-python = ">=3.10"
dependencies = [
  "torch==2.13.0",
  "transformers==5.16.1",
  "onnx==1.22.0",
  "onnxruntime==1.24.3",
  "numpy==2.2.6",
]

[tool.uv]
package = false

[dependency-groups]
audit = ["pip-audit==2.10.1"]
