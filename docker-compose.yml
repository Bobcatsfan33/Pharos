# Pharos local product stack — durable runtime plus operational and evidence stores.
# Storage tiers:
#   postgres -> operational state (policies, mandates, tenants, queues, chained action_records)
#   minio    -> S3-compatible WORM object storage with Object Lock for the evidence chain
#   redis    -> deadline-bound verdict caches
services:
  postgres:
    image: postgres:16-alpine
    container_name: pharos-postgres
    environment:
      POSTGRES_USER: pharos
      POSTGRES_PASSWORD: pharos_local_dev
      POSTGRES_DB: pharos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharos"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pharos_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pharos-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pharos_redis:/data

  minio:
    image: minio/minio:latest
    container_name: pharos-minio
    command: ["server", "/data", "--console-address", ":9011"]
    environment:
      MINIO_ROOT_USER: pharos
      MINIO_ROOT_PASSWORD: pharos_local_dev
    ports:
      - "9010:9000"
      - "9011:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pharos_minio:/data

  runtime:
    build:
      context: ./runtime/python
    container_name: pharos-runtime
    environment:
      PHAROS_RUNTIME_DATA_DIR: /data
      PHAROS_URL: ${PHAROS_URL:-http://host.docker.internal:4000}
      PHAROS_API_KEY: ${PHAROS_API_KEY:-}
      PHAROS_TENANT_ID: ${PHAROS_TENANT_ID:-}
    ports:
      - "8321:8321"
    volumes:
      - pharos_runtime:/data

volumes:
  pharos_pg:
  pharos_redis:
  pharos_minio:
  pharos_runtime:
