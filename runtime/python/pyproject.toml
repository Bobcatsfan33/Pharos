[project]
name = "keel"
version = "0.2.0"
description = "Durable execution for LLM agents: an append-only event log that resumes after a crash, replays byte-identically, and never re-bills a completed model call."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "KEEL contributors" }]
keywords = ["agents", "llm", "runtime", "observability", "durable-execution", "ai"]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
pg = ["asyncpg>=0.29"]
nats = ["nats-py>=2.6"]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
crewai = ["pyyaml>=6"]
# Framework adapters (run an unmodified agent under KEEL). The reference agents are
# SDK-free; these extras enable the live SDK integration paths.
langchain = ["langchain-core>=0.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
pydantic-ai = ["pydantic-ai>=0.0.14"]
# Optional convenience DSL (Agent/Task/Crew). It compiles to KIR and is not the
# headline; the core install and every headline example use KIR or an adapter.
authoring = []
sandbox = []
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "mypy>=1.9", "ruff==0.15.20", "import-linter>=2"]

[project.scripts]
keel = "keel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["keel/substrate", "keel/executor", "keel/services", "keel/kir", "keel/authoring", "keel/adapters", "keel/cli.py", "keel/viewer"]

[[tool.mypy.overrides]]
# Optional heavy deps (only present with the matching extra installed).
module = ["asyncpg.*", "nats.*", "fastapi.*", "uvicorn.*", "opentelemetry.*", "yaml",
          "langchain_core.*", "langgraph.*", "openai.*", "anthropic.*", "agents.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.importlinter]
root_package = "keel"

[[tool.importlinter.contracts]]
name = "Layers point downward only"
type = "layers"
# KIR is the intermediate-representation *contract* the executor runs, so it sits
# as a leaf just above the substrate: executor / services / authoring all lower
# onto it, and it imports nothing from KEEL itself. The DX->KIR *compiler*
# (kir.compile) is authored against this same contract and reached from L5.
layers = [
    "keel.adapters",
    "keel.authoring",
    "keel.services",
    "keel.executor",
    "keel.kir",
    "keel.substrate",
]

[[tool.importlinter.contracts]]
name = "Substrate imports nothing from KEEL above it"
type = "forbidden"
source_modules = ["keel.substrate"]
forbidden_modules = [
    "keel.kir",
    "keel.executor",
    "keel.services",
    "keel.authoring",
]
