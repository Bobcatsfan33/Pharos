# gitleaks configuration for Pharos (S2-T3).
# Extends the default rule set; the allowlist below is the triage record for every
# finding that has been reviewed and dismissed with a reason. No real secret is allowlisted.
title = "Pharos gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives — documentation placeholders, not real secrets."
# Documentation files whose only "secret-like" strings are placeholders and env-var NAMES:
#   - deploy/INSTALL.md line ~14: a checklist of variable NAMES to set (PHAROS_S3_ACCESS_KEY,
#     PHAROS_S3_SECRET_KEY, ...) and placeholder connection strings (postgres://...). No values.
#   - examples/README.md line ~15: the usage example `PHAROS_API_KEY=<key> pnpm tsx ...`,
#     where `<key>` is a literal placeholder.
# The real local-dev credentials live only in .env.example / docker-compose.yml (documented,
# non-production, and intentionally committed as local dev defaults).
# MandateToken conformance vectors. gitleaks raises 45 generic-api-key findings here, every
# one of them a `nextKey` value: a raw 32-byte Ed25519 *public* key, base64-encoded, which is
# published inside the token by design so the next block's signature can be verified. The
# tenant mandate (root) signing key's private half is never written to this file.
# The file does contain four `proof.secret` values — the ephemeral attenuation keys, which are
# part of the token format (the holder carries the current one in order to attenuate further).
# In these vectors they are deterministic throwaway seeds generated by
# scripts/gen-mandate-token-vectors.ts from a fixed counter (28 zero bytes + 0x5eed0064..6a),
# they authenticate nothing outside the test fixture, and they are regenerated by that script.
# Reviewed: no credential for any Pharos deployment is allowlisted here.
paths = [
  '''deploy/INSTALL\.md''',
  '''examples/README\.md''',
  '''packages/core/test/mandate-token/vectors\.json''',
]
# Extra safety net for placeholder tokens that may appear in other docs/examples.
regexes = [
  '''<key>''',
  '''<token>''',
  '''<admin-token>''',
  # Public tokenizer artifact digest recorded for supply-chain verification.
  # This exact SHA-256 value is not a credential or authentication token.
  '''672146ee6867dc02a01c474090e237789f8a066ee7247bb2cb6c8688a27536a8''',
]
