[project]
name = "getpharos"
version = "0.3.0"
description = "Pharos SDK — submit agent actions for a real-time policy verdict and sealed evidence."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["ai-agents", "agent-governance", "policy-engine", "guardrails", "audit-log", "evidence", "mcp", "llm", "pharos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pharos_sdk"]

[tool.setuptools.package-data]
pharos_sdk = ["py.typed"]
