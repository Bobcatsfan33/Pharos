<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/><stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.55"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- lighthouse beam -->
  <path d="M 1040 170 L 1280 20 L 1280 320 Z" fill="url(#beam)"/>
  <path d="M 1040 170 L 1280 90 L 1280 250 Z" fill="#fbbf24" fill-opacity="0.18"/>
  <!-- lighthouse -->
  <rect x="1022" y="170" width="36" height="300" rx="4" fill="#e5e7eb"/>
  <rect x="1022" y="230" width="36" height="22" fill="#dc2626"/>
  <rect x="1022" y="300" width="36" height="22" fill="#dc2626"/>
  <rect x="1022" y="370" width="36" height="22" fill="#dc2626"/>
  <rect x="1012" y="150" width="56" height="26" rx="6" fill="#fbbf24"/>
  <rect x="1000" y="470" width="80" height="16" rx="4" fill="#9ca3af"/>
  <!-- text -->
  <text x="88" y="200" fill="#f9fafb" font-size="88" font-weight="800" letter-spacing="-2">Pharos</text>
  <text x="92" y="262" fill="#fbbf24" font-size="30" font-weight="600">Pharos decides. Pharos proves.</text>
  <text x="92" y="340" fill="#e5e7eb" font-size="30" font-weight="500">Real-time policy verdicts for AI agents,</text>
  <text x="92" y="382" fill="#e5e7eb" font-size="30" font-weight="500">with signed, hash-chained evidence of every decision.</text>
  <g font-size="22" fill="#9ca3af">
    <text x="92" y="470">allow · block · modify · escalate</text>
    <text x="92" y="506">one transaction · verifiable offline · Apache-2.0</text>
  </g>
  <text x="92" y="582" fill="#6b7280" font-size="22" font-family="ui-monospace, Menlo, monospace">github.com/Bobcatsfan33/Pharos</text>
</svg>
